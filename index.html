<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sleep Tracker">
<meta name="application-name" content="Sleep Tracker">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#07050f" id="theme-meta">
<title>Sleep Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<style>
:root{--bg:#07050f;--card:#16131f;--card2:#201c2c;--tx:#f4f1fb;--mu:#9b94b0;--ac:#c14df0;--ac2:#8f3be0;--cy:#4fd8e8;--lime:#b6ff3b;--line:#ffffff14;--glow:#c14df066;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);color-scheme:dark}
:root[data-theme="light"]{--bg:#f3effa;--card:#fff;--card2:#ebe5f7;--tx:#1a1426;--mu:#6d6385;--line:#0000001a;--glow:#c14df033;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"SF Pro Rounded","SF Pro Display","Segoe UI",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
input,textarea{-webkit-user-select:text;user-select:text}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
main{flex:1;overflow-y:auto;padding:14px 18px 24px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.anim main>section{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
nav{display:flex;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);border-radius:26px 26px 0 0}
nav button{flex:1;background:none;border:0;color:var(--mu);font:600 11px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;transition:color .2s}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--tx)}nav button.on svg{stroke:var(--ac);filter:drop-shadow(0 0 6px var(--ac))}
h1{font-size:30px;margin:6px 0 2px;letter-spacing:-.02em}h2{font-size:17px;margin:0 0 10px}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:18px;padding:13px 14px;border:1px solid var(--line)}
.stat b{display:block;font-size:22px;margin-top:4px;letter-spacing:-.01em}.stat span{font-size:13px;color:var(--mu)}
.seg{display:flex;background:var(--card);border-radius:20px;padding:5px;margin:10px 0 14px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:none;color:var(--tx);font:600 15px inherit;font-family:inherit;padding:11px 0;border-radius:16px;transition:.2s}
.seg button.on{background:#fff;color:#14101e;box-shadow:0 2px 10px #0004}
.ring{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:14px auto 8px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 22px var(--glow))}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-size:44px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:10px;justify-content:center;margin-bottom:18px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:9px 14px;font-size:14px;display:flex;align-items:center;gap:8px}
.chip svg{width:16px;height:16px;stroke:var(--cy);fill:none;stroke-width:2;stroke-linecap:round}
.ctl{display:flex;align-items:center;justify-content:center;gap:14px;padding:6px 0}
.main-btn{flex:1;max-width:260px;height:68px;border:0;border-radius:34px;color:#fff;font:700 19px inherit;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,#d65cff,#7a35e8);box-shadow:0 0 0 1px #ffffff30 inset,0 8px 30px var(--glow),0 0 40px #c14df055;transition:transform .15s}
.main-btn:active{transform:scale(.96)}.main-btn svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.main-btn.wake{background:linear-gradient(135deg,#ffd35c,#ff8f3a);box-shadow:0 8px 30px #ff9f3a55}
.pause{width:68px;height:68px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--tx);font:600 11px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.pause.on{border-color:var(--cy);color:var(--cy);box-shadow:0 0 18px #4fd8e855}
.pause svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head button,.icon-btn{background:var(--card);border:1px solid var(--line);color:var(--tx);width:40px;height:40px;border-radius:14px;font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 0;text-align:center}
.cal .wd{font-size:12px;color:var(--mu);padding-bottom:4px}
.day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:0;background:none;padding:2px}
.day i{width:100%;max-width:40px;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 13px inherit;font-style:normal;color:#0b0813;background:var(--card2);transition:transform .15s}
.day.e i{color:var(--mu);font-weight:500}.day.f i{opacity:.35;background:none;color:var(--mu)}
.day.t i{outline:2px solid var(--tx);outline-offset:2px}.day.d i{box-shadow:0 0 12px currentColor}.day:active i{transform:scale(.88)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:14px;font-size:12px;color:var(--mu)}
.legend span{display:flex;align-items:center;gap:5px}.legend u{width:10px;height:10px;border-radius:50%}
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:var(--tx);font-family:inherit;text-align:left}
.row:first-child{border-top:0}.row .dot{width:12px;height:12px;border-radius:50%;flex:none}.row .g{flex:1}.row b{font-size:16px}
.add{position:relative}
.btn{border:0;border-radius:16px;padding:14px;font:600 16px inherit;font-family:inherit;background:var(--card2);color:var(--tx);width:100%;margin-top:8px}
.btn.pri{background:linear-gradient(135deg,#d65cff,#7a35e8);color:#fff}.btn.red{background:#ff4d6d22;color:#ff6b86}
#sheet{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
#sheet .p{background:var(--card);width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.anim #sheet.on .p{animation:up .3s ease}@keyframes up{from{transform:translateY(60px);opacity:0}}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 5px}
input,textarea,select{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:14px;padding:12px;font:16px inherit;font-family:inherit}
input[type=datetime-local],input[type=time]{min-height:46px;min-width:0;text-align:left}
textarea{height:140px;font-size:12px;font-family:ui-monospace,monospace}
.sw{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.tg{width:52px;height:30px;border-radius:15px;background:var(--card2);border:0;position:relative;transition:.2s}.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--ac2)}.tg.on::after{left:25px}
.empty{text-align:center;padding:30px 10px;color:var(--mu)}
.pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:10px;background:var(--card2);color:var(--cy)}
/* добавлено в v1.1 */
.prow{display:flex;align-items:center;gap:8px;margin-top:8px}.prow input{flex:1}.prow span{color:var(--mu)}
.hint{font-size:13px;color:var(--mu);line-height:1.45}
.warn{background:#ff4d6d22;color:#ff6b86;border-radius:16px;padding:12px 14px;font-size:14px;margin:10px 0 12px;line-height:1.4}
</style>
</head>
<body class="anim">
<div id="app"><main id="main"></main>
<nav id="nav"></nav></div>
<div id="sheet"><div class="p" id="sp"></div></div>
<noscript><div style="padding:24px;color:#f4f1fb">Для работы Sleep Tracker нужен JavaScript.</div></noscript>
<script src="js/core.js"></script>
<script src="js/views.js"></script>
</body>
</html>
